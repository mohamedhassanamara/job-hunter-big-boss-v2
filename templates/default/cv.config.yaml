# Default CV template: style settings only (no content). See docs/CV_TEMPLATES.md.
name: Default
description: One column, small caps section titles with a blue rule, Font Awesome contact icons.
paper: letter            # letter | a4
# Section order and titles. A section with no content is omitted entirely.
sections:
  - key: summary
    title: Summary
  - key: skills
    title: Technical Skills
  - key: experience
    title: Professional Experience
  - key: projects
    title: Projects
  - key: certifications
    title: Certifications
  - key: education
    title: Education
  - key: volunteering
    title: Volunteering & Leadership
# Header: first line = location, phone, email; second line = links. Empty items are skipped.
icons:
  location: map-marker-alt
  phone: phone
  email: envelope
  links:
    linkedin: linkedin
    github: github
    portfolio: globe
    other: link
# One-page fit: the page must be at least this full (0-1); bullets per role before trimming.
min_fill: 0.98
max_bullets_per_role: 5
max_stack_items: 6       # tech shown next to a project name

# Cover letter: templates/<name>/cover_letter.tex.j2 (same header as the CV). Without it this
# template can only render CVs.
cover_letter:
  enabled: true
