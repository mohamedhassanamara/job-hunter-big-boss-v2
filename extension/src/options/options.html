<!doctype html>
<meta charset="utf-8" />
<title>Job Hunter capture: setup</title>
<style>
  :root { color-scheme: light dark }
  body { max-width: 560px; margin: 32px auto; padding: 0 16px; font: 14px/1.5 system-ui, sans-serif }
  label { display: block; margin-top: 14px; font-weight: 600 }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit }
  button { margin-top: 14px; padding: 6px 12px; font: inherit; cursor: pointer }
  .small { font-size: 12px; opacity: .75 } .ok { color: #1a7f37 } .no { color: #cf222e }
</style>
<h1>Job Hunter capture</h1>
<p>Pair this extension with your Job Hunter app. In the app: <b>Settings → LinkedIn → Browser extension → Create token</b>, copy it, paste it here.</p>
<label for="token">Token</label>
<input id="token" type="password" autocomplete="off" spellcheck="false" />
<label for="api">App address (backend)</label>
<input id="api" type="text" spellcheck="false" />
<label for="app">App address (web page, for “Open in app” links)</label>
<input id="app" type="text" spellcheck="false" />
<p class="small">Only <code>http://localhost</code> or <code>http://127.0.0.1</code> is accepted: the extension never talks to anything else except the LinkedIn page you are viewing.</p>
<button id="save">Save</button> <button id="test">Test connection</button>
<p id="result" class="small"></p>
<script src="options.js"></script>
