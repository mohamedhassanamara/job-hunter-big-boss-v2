  "description": "<h2><strong>Who we are</strong></h2><p></p><p>Yubo is the Social Discovery app to make new friends and hang out online. By eliminating likes and follows, we empower our users to create genuine connections and show up as their true selves.</p><p></p><p>We&#39;ve pioneered a new way for Gen Z to socialize online, and with millions of active users, our goal is to redefine how we connect today and tomorrow.</p><p></p><p>Our team is international, multicultural and deeply committed to its mission. As the leading platform to socialize online, we have a special responsibility to build a safe digital space for our community. Safety is embedded in our DNA, and our proactive approach focuses on user protection, support, and education. We also work closely with the broader technology industry to share our knowledge and NGOs create industry-leading child protection standards.</p><p></p><p>Join us in this exciting journey and help us shape the future of social interactions!</p><h2><strong>About this role</strong></h2><p>As Yubo continues to scale, Machine Learning is becoming a <strong>core production layer</strong>, powering critical systems across safety, recommendations, and product optimization.</p><p>What makes this role unique is both the <strong>scale and diversity of our data</strong>, and the <strong>level of maturity we are aiming to reach</strong>.</p><p>We process <strong>massive volumes of images, text, and real-time user interactions</strong>, across millions of users worldwide, creating a wide range of high-impact ML challenges, including:</p><ul><li><p>Content moderation (image, text, behavior)</p></li><li><p>Recommendation systems and user engagement optimization</p></li><li><p>Behavioral detection and trust &amp; safety models</p></li><li><p>Emerging use cases such as dynamic pricing and growth optimization</p></li></ul><p>At the same time, our current ML stack is still evolving.<br/>Legacy models are not fully integrated into pipelines, lifecycle management remains inconsistent, and our approach can sometimes resemble “develop, deploy, and forget.”</p><p>As ML usage expands across the company, this creates increasing <strong>complexity and dependency on reliable, well-structured systems</strong>.</p><p>There is still a <strong>huge amount of untapped potential</strong>, with many ML use cases yet to be designed, tested, and scaled, but unlocking it requires building a more robust and scalable ML operating model.</p><p>We are therefore looking for a <strong>Staff ML Engineer</strong> to join our Platform Engineering team, reporting directly to Mikael (Head of Platform Engineering).</p><p></p><h2><strong>Your responsibilities</strong></h2><h3><strong>ML Systems &amp; Delivery</strong></h3><ul><li><p>Deliver end-to-end ML use cases (recommendation, safety algorithms, etc.).</p></li><li><p>Ensure production readiness, scalability, and long-term maintainability.</p></li><li><p>Balance speed of delivery with robustness and reliability .</p></li></ul><h3><strong>ML Lifecycle &amp; Reliability</strong></h3><ul><li><p>Define and improve the full ML lifecycle (training, deployment, monitoring, iteration).</p></li><li><p>Establish KPIs and monitoring standards to track model performance over time.</p></li><li><p>Ensure continuous alignment with product and safety objectives .</p></li></ul><h3><strong>Platform &amp; Standardization</strong></h3><ul><li><p>Contribute to the “ML as a Platform” strategy (tools, workflows, reusable components).</p></li><li><p>Define scalable standards for ML development across teams.</p></li><li><p>Enable self-service ML capabilities .</p></li></ul><h3><strong>Legacy &amp; Advanced Use Cases</strong></h3><ul><li><p>Take ownership of legacy models and realign them with current business needs.</p></li><li><p>Improve, retrain, and integrate them into modern pipelines.</p></li><li><p>Define standards for LLM usage (moderation, recommendation).</p></li><li><p>Explore and implement advanced ML approaches where relevant .</p></li></ul><h3><strong>Cross-functional Leadership</strong></h3><ul><li><p>Partner with Data Engineering, MLOps, Backend Platform, and Product teams.</p></li><li><p>Act as a bridge between ML, platform, and business stakeholders.</p></li><li><p>Bring technical leadership and structure to ML practices across the organization.</p><p></p></li></ul><h2><strong>Our technical environment / ML scope</strong></h2><ul><li><p><strong>ML frameworks:</strong> PyTorch</p></li><li><p><strong>Languages:</strong> Python (data stack)</p></li><li><p><strong>Core topics:</strong> Neural networks, LLMs, data sampling</p></li><li><p><strong>Use cases:</strong> Recommendation systems, safety algorithms, moderation</p></li><li><p><strong>Ecosystem:</strong> Data Engineering, MLOps pipelines, Backend Platform</p><p></p></li></ul><h2><strong>Who you are</strong></h2><ul><li><p>You have <strong>8–10 years of experience</strong> in ML / Data, including work on large-scale datasets (datasets of hundreds of gigabytes) .</p></li><li><p>You have strong expertise in <strong>modern ML frameworks</strong> (TensorFlow or PyTorch or JAX).</p></li><li><p>You are highly proficient in <strong>Python (data ecosystem)</strong>.</p></li><li><p>You have deep knowledge of <strong>neural networks and LLMs</strong>.</p></li><li><p>You understand ML systems end-to-end (data → training → deployment → monitoring).</p></li><li><p>You have strong experience in <strong>production ML systems</strong>, not only research.</p></li><li><p>You demonstrate strong <strong>product sense</strong> and can align models with business needs.</p></li><li><p>You are pragmatic and impact-driven (not purely research-oriented).</p></li><li><p>You are able to explain complex ML topics clearly (strong pedagogy).</p></li><li><p>You operate well under ambiguity and can structure complex problems.</p></li><li><p>You bring technical leadership and influence without authority.</p><p></p></li></ul><h2><strong>In your first 6 months, you will</strong></h2><ul><li><p>Deliver an <strong>end-to-end ML use case</strong> to validate impact and execution.</p></li><li><p>Audit and improve lifecycle management of existing ML models.</p></li><li><p>Refactor and retrain at least one <strong>legacy safety model</strong>.</p></li><li><p>Define and implement a <strong>reusable OCR standard</strong> as a platform component.</p></li><li><p>Establish standards for <strong>LLM usage</strong> in moderation and recommendation systems.</p></li><li><p>Contribute to defining the ML platform strategy and operating model.</p></li><li><p>Shift the organization from “deploy &amp; forget” to <strong>reliable, measurable ML systems at scale</strong>.</p><p></p></li></ul><h2><strong>The recruitment process</strong></h2><ul><li><p>Phone screen with a Talent Acquisition Manager</p></li><li><p>Interview with Mikael (Platform Engineering Director)</p></li><li><p>Technical case study</p></li><li><p>Cultural fit assessments</p></li></ul><p></p><h2><strong>What we offer</strong></h2><ul><li><p>A highly competitive salary range as well as equity in the company</p></li><li><p>A highly flexible remote work policy, 2 days at the office per month, with monthly team events.</p></li><li><p>We also cover fees for external professional events and meetups (Android Makers, etc…)</p></li><li><p>Great health insurance coverage for both you and your family by Alan, fully paid for by Yubo !</p></li><li><p>Numerous benefits for parents: additional parental leave, easy access to nurseries and daycare facilities in France.</p></li></ul><p></p><p></p><h2><strong>Our approach to privacy &amp; safety</strong></h2><p>As part of your role, you may handle tools and features involving personal data. We expect all employees to demonstrate strong awareness of privacy and safety issues, and to actively support our Privacy &amp; Safety by Design efforts.</p><p></p><p>Join Yubo and help shape the future of Social Discovery while enjoying a culture that values flexibility, well-being, and impact.</p> <p>Here’s how we live our mission every day:</p><p><strong>Y</strong>ou own the impact: Step up, adapt, and make it matter</p><p><strong>U</strong>nconventionally Smart: Hack with intent, borrow smart, build better</p><p><strong>B</strong>e Bold &amp; Resilient: Raise your head, break barriers, keep moving forward</p><p><strong>O</strong>ne team, one mission: No egos, no passengers, just shared wins</p> <p><strong>Trust &amp; Flexibility:</strong> Our hybrid model calls for only two office days a month; the rest is up to the rhythm that works best for you.</p> <p>Enjoy Top-notch Benefits</p><p>Culture is central at Yubo, hence the numerous benefits:</p><p><strong>Cool Workplace</strong>: enjoy our amazing Parisian office and our many hybrid work options</p><p><strong>Team Activities</strong>: participate in get-togethers, events, and team-building activities</p><p><strong>Family-Friendly</strong>: we support parents with childcare options and family-friendly policies</p><p><strong>Wellness Programs</strong>: benefit from comprehensive health insurance, wellness programs, sports classes, and mental well-being initiatives</p>",
